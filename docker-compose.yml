services:
  app:
    build:
      context: .
      target: dev
    container_name: job-search-app
    env_file:
      - .env.local
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_CODEX_AUTH_MODE: local-host
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - job_search_node_modules:/app/node_modules
      - job_search_next:/app/.next
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

volumes:
  job_search_node_modules:
  job_search_next:
